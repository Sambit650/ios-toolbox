name: Swift Package CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          XCODE=${XCODE:-/Applications/Xcode.app}
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: swift package resolve

      - name: Pick an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^\s+(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "Simulator: $DEVICE"
          echo "SIM_NAME=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Toolbox-Package \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            | tail -n 200
